<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquête Sortaman</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        .card {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        p {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Formulaire de code secret */
        .password-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        input[type="password"] {
            padding: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            outline: none;
            transition: border-color 0.3s ease;
        }

        input[type="password"]:focus {
            border-color: #3498db;
        }

        .btn-submit {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-submit:hover {
            background-color: #27ae60;
        }

        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        /* Zone de contenu protégé (masquée par défaut) */
        #protected-content {
            display: none;
        }

        .btn-download {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
        }

        .btn-download:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }

        .btn-download:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Enquête Sortaman</h1>

        <!-- Formulaire pour saisir le code d'accès -->
        <div id="login-form">
            <p>Cet accès est protégé. Veuillez entrer le code secret pour continuer :</p>
            <div class="password-box">
                <input type="password" id="secret-code" placeholder="Entrez le code ici">
                <button class="btn-submit" onclick="checkCode()">Accéder</button>
            </div>
            <p id="error-message" class="error-msg">Code incorrect. Réessayez !</p>
        </div>

        <!-- Contenu affiché après avoir entré le bon code -->
        <div id="protected-content">
            <p>Accès autorisé ! Cliquez ci-dessous pour télécharger le fichier de l'enquête au format .odt.</p>
            
            <a href="enquete_sortaman.odt" download="Enquete_Sortaman.odt" class="btn-download">
                Télécharger (.odt)
            </a>
        </div>
    </div>

    <script>
        // Define your access code here
        const CODE_SECRET = "Sortaman LE PIRE";

        function checkCode() {
            const inputVal = document.getElementById("secret-code").value;
            const errorMsg = document.getElementById("error-message");
            const loginForm = document.getElementById("login-form");
            const protectedContent = document.getElementById("protected-content");

            if (inputVal === CODE_SECRET) {
                // Code correct : on cache le formulaire et on montre le lien de téléchargement
                loginForm.style.display = "none";
                protectedContent.style.display = "block";
            } else {
                // Code incorrect : on affiche le message d'erreur
                errorMsg.style.display = "block";
            }
        }

        // Permet d'appuyer sur la touche "Entrée" pour valider le code
        document.getElementById("secret-code").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkCode();
            }
        });
    </script>

</body>
</html>
